name: Fixture status & results refresh (free endpoints)

on:
  schedule:
    # every 6 hours: 00:17 / 06:17 / 12:17 / 18:17 UTC (= +2h CAT)
    # automatic refresh of fixture status + results without spending odds quota
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: status-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh fixture status from free scores feed + rebuild pages
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TZ: Africa/Lusaka
        run: python tools/refresh_status.py

      - name: Refresh home page pointer (latest.json / index)
        env:
          TZ: Africa/Lusaka
        run: python update_site_index.py

      - name: Commit refreshed status, calendar and results
        run: |
          git config user.name "value-bot"
          git config user.email "value-bot@users.noreply.github.com"
          git add -f data/value_bets.db data/calendar_data.json data/latest.json \
                      calendar.html results.html admin.html index.html || true
          git commit -m "status refresh $(date -u +'%F %H:%M UTC')" || echo "nothing to commit"
          git push || true
