name: Daily value-bet report

on:
  schedule:
    # 04:30 UTC = 06:30 CAT (Africa/Lusaka), every day. Edit this cron line to
    # change the automatic schedule.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      suspend_predictions:
        description: "Admin kill-switch: verify & analyse but publish NO picks"
        type: boolean
        default: false
      recalc_predictions:
        description: "Deliberate recalculation: revise prediction snapshots (revision-logged, originals kept)"
        type: boolean
        default: false

# never run two pipelines over the same tracking DB at once
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TZ: Africa/Lusaka
          SUSPEND_PREDICTIONS: ${{ inputs.suspend_predictions || false }}
          RECALC_PREDICTIONS: ${{ inputs.recalc_predictions || false }}
        run: python run_daily.py

      - name: Settle yesterday's pending picks
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TZ: Africa/Lusaka
        run: python settle.py --quiet || true

      - name: Build results & verification page
        env:
          TZ: Africa/Lusaka
        run: python build_results_page.py

      - name: Build admin dashboard
        run: python build_admin_page.py

      - name: Build match calendar (live fixtures/results data page)
        env:
          TZ: Africa/Lusaka
        run: python build_calendar.py

      - name: Publish site index page (for GitHub Pages)
        run: python update_site_index.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/
          retention-days: 30

      - name: Commit tracking database + reports + site page back to repo
        run: |
          git config user.name "value-bot"
          git config user.email "value-bot@users.noreply.github.com"
          git add -f data/value_bets.db data/calendar_data.json reports/ \
                      index.html results.html admin.html calendar.html || true
          git commit -m "daily run $(date +%F)" || echo "nothing to commit"
          git push || true
