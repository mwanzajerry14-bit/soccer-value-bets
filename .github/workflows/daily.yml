name: Daily value-bet report

on:
  schedule:
    # 04:30 UTC = 06:30 CAT (Africa/Johannesburg), every day
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # allows manual triggering from the GitHub UI

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TZ: Africa/Johannesburg
        run: python run_daily.py

      - name: Settle yesterday's pending picks
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TZ: Africa/Johannesburg
        run: python settle.py --quiet || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/
          retention-days: 30

      - name: Commit tracking database back to repo
        # Keeps a persistent bet history across runs. Assumes the SQLite
        # DB in data/ IS committed to the repo (adjust .gitignore accordingly).
        run: |
          git config user.name "value-bot"
          git config user.email "value-bot@users.noreply.github.com"
          git add -f data/value_bets.db reports/ || true
          git commit -m "daily run $(date +%F)" || echo "nothing to commit"
          git push || true
